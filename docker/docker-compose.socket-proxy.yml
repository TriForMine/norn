services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  norn:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: norn:local
    ports:
      - "8787:8787"
    volumes:
      - ../data:/data
      - ./config.socket-proxy.toml:/etc/norn/config.toml:ro
    depends_on:
      - docker-socket-proxy
    restart: unless-stopped
