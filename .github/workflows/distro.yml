name: Distro

# Verify the binary builds and the package collector works correctly on a
# representative set of Linux distributions. Container jobs give us the real
# distro userspace (glibc version, package manager binaries) on Ubuntu runners.
#
# These jobs intentionally do not duplicate format/clippy/unit-test checks from
# ci.yml. They focus on:
#   1. The binary compiling successfully against each distro's glibc.
#   2. The package collector executing dpkg-query / rpm against real packages.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 (Noble)
            image: ubuntu:24.04
            family: debian

          - name: Ubuntu 22.04 (Jammy)
            image: ubuntu:22.04
            family: debian

          - name: Debian 12 (Bookworm)
            image: debian:12
            family: debian

          - name: Fedora 41
            image: fedora:41
            family: rpm

          - name: Rocky Linux 9
            image: rockylinux:9
            family: rpm

          - name: Amazon Linux 2023
            image: amazonlinux:2023
            family: rpm

    steps:
      - name: Install system dependencies (Debian/Ubuntu)
        if: matrix.family == 'debian'
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config libssl-dev git jq

      - name: Install system dependencies (RPM)
        if: matrix.family == 'rpm'
        run: |
          dnf install -y \
            curl-minimal gcc pkg-config \
            openssl-devel git findutils jq

      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: distro-${{ matrix.name }}

      - name: Build (release)
        run: cargo build --release --locked -p norn-cli

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: Smoke test dpkg-query (Debian/Ubuntu)
        if: matrix.family == 'debian'
        run: |
          COUNT=$(RUST_LOG=off ./target/release/norn inventory --output json | jq '[.[] | select(.kind == "package")] | length')
          echo "Found ${COUNT} packages from dpkg-query"
          [ "${COUNT}" -gt 0 ] || { echo "ERROR: expected at least one package"; exit 1; }

      - name: Smoke test rpm (RPM-based)
        if: matrix.family == 'rpm'
        run: |
          COUNT=$(RUST_LOG=off ./target/release/norn inventory --output json | jq '[.[] | select(.kind == "package")] | length')
          echo "Found ${COUNT} packages from rpm"
          [ "${COUNT}" -gt 0 ] || { echo "ERROR: expected at least one package"; exit 1; }
