name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            apps/web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Build dashboard
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install cross (aarch64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build binary (native)
        if: "!matrix.cross"
        run: cargo build --release --locked -p norn-cli

      - name: Build binary (cross)
        if: matrix.cross
        run: cross build --release --locked -p norn-cli --target ${{ matrix.target }}

      - name: Package
        run: |
          ARCHIVE=norn-${{ github.ref_name }}-${{ matrix.name }}
          mkdir -p dist/${ARCHIVE}
          cp target/${{ matrix.target }}/release/norn dist/${ARCHIVE}/ 2>/dev/null || \
            cp target/release/norn dist/${ARCHIVE}/
          cp -r apps/web/dist dist/${ARCHIVE}/web
          cp README.md LICENSE dist/${ARCHIVE}/
          tar -czf ${ARCHIVE}.tar.gz -C dist ${ARCHIVE}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: norn-${{ matrix.name }}
          path: norn-${{ github.ref_name }}-${{ matrix.name }}.tar.gz

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: norn-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true

  docker:
    name: Push Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: norn-linux-x86_64

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
