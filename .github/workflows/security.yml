name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday at 04:21 UTC
    - cron: "21 4 * * 1"

permissions:
  contents: read

jobs:
  norn-sarif:
    name: Norn SARIF export
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate fixture scan
        env:
          NORN_DATABASE_URL: sqlite://./target/norn-security.db
        run: cargo run -p norn-cli -- scan --config ./examples/config.toml --no-progress

      - name: Export SARIF
        env:
          NORN_DATABASE_URL: sqlite://./target/norn-security.db
        run: cargo run -p norn-cli -- report --config ./examples/config.toml --format sarif --output target/norn.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/norn.sarif

  rust-security:
    name: Rust dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cargo-deny and cargo-audit are cached via rust-cache because they are
      # installed into the Cargo binary directory, which is part of the cache
      # key. Installing from source without --locked would re-compile on every
      # run; --locked pins to the exact version in each tool's own Cargo.lock.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo deny check
        run: cargo deny check

      - name: cargo audit
        run: cargo audit

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
